services:
  postgres:
    image: postgres:16-alpine
    container_name: family-tree-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: family_tree
    volumes:
      - family_tree_pg_data:/var/lib/postgresql/data

volumes:
  family_tree_pg_data:
